[workspace]
resolver = "3"
members = [
    "crates/flipper-core",
    "crates/flipper-dfu",
    "crates/flipper-protocol",
    "crates/flipper-update",
    "crates/flipper-app",
    "crates/flipper-project",
    "crates/flipper-cli",
    "crates/flipper-gui",
]

[workspace.package]
version = "0.8.1"
edition = "2024"
rust-version = "1.90"
authors = ["flipper-companion contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/zx97/flipper-companion"
homepage = "https://github.com/zx97/flipper-companion"
description = "A modern, memory-safe desktop companion for the Flipper Zero"
keywords = ["flipper", "flipper-zero", "usb", "dfu", "hardware"]
categories = ["command-line-utilities", "hardware-support"]

[workspace.dependencies]
# Internal crates
flipper-companion-core = { path = "crates/flipper-core", version = "0.8.1" }
flipper-companion-dfu = { path = "crates/flipper-dfu", version = "0.8.1" }
flipper-companion-project = { path = "crates/flipper-project", version = "0.8.1" }
flipper-companion-protocol = { path = "crates/flipper-protocol", version = "0.8.1" }
flipper-companion-update = { path = "crates/flipper-update", version = "0.8.1" }
flipper-companion-app = { path = "crates/flipper-app", version = "0.8.1" }

# Runtime / async
anyhow = "1"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync", "fs", "net"] }
tokio-serial = "5.5"
tokio-util = { version = "0.7", features = ["codec"] }

# Hardware
nusb = "0.2"
serialport = "4"

# Protocol
prost = "0.14"
protox = "0.10"

# Networking / data
flate2 = "1"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "http2", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.11"
tar = "0.4"

# Errors / logging / CLI
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GUI
slint = "1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
