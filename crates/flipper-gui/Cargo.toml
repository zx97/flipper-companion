[package]
name = "flipper-companion"
description = "Desktop companion for the Flipper Zero: device management, firmware updates, file browser, live screen mirroring with a remote keypad, backups and a Flipper application catalog that installs and updates apps on the SD card."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "flipper-companion"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flipper-companion-app.workspace = true
flipper-companion-core.workspace = true
flipper-companion-dfu.workspace = true
flipper-companion-protocol.workspace = true
flipper-companion-update.workspace = true
hex.workspace = true
sha2.workspace = true
slint.workspace = true
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
slint-build = "1.18"
